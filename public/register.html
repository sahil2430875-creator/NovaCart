<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | NovaCart</title><link rel="stylesheet" href="style.css"><style>
.auth-wrap{min-height:65vh;display:grid;place-items:center;padding:44px 0}.auth-card{width:min(460px,92vw);background:var(--card);border:1px solid var(--border);border-radius:18px;padding:30px;box-shadow:var(--shadow)}.auth-card h1{margin-bottom:8px}.auth-card p{color:var(--muted);margin-bottom:20px}.auth-card .field{margin:15px 0}.auth-card input{width:100%;padding:12px;border:1px solid var(--border);border-radius:9px;background:var(--background);color:var(--text)}.auth-card button{width:100%;margin-top:10px}.auth-msg{margin-top:14px!important;font-weight:600}.auth-links{margin-top:18px;text-align:center}
</style></head><body>
<header class="topbar"><div class="container navbar"><a href="index.html" class="logo"><span class="logo-icon">N</span>NovaCart</a><nav class="nav-links"><a href="index.html">Home</a><a href="products.html">Products</a></nav></div></header>
<main class="container auth-wrap"><section class="auth-card"><h1>Create account</h1><p>Register to start shopping on NovaCart.</p>
<form id="registerForm"><div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required maxlength="80" placeholder="Your full name"></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters"></div><button class="primary-btn" type="submit">Create account</button><p id="authMessage" class="auth-msg" role="status"></p></form>
<div class="auth-links">Already registered? <a href="login.html"><strong>Login</strong></a></div></section></main><script src="auth.js"></script></body></html>
